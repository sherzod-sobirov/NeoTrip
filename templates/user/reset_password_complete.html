{% load static %}
{% load i18n %}

<head>
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
</head>
<body>
    <div style="
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: url('{% static 'assets/img/travel.jpg' %}');
        background-size: cover;
        background-position: center;
    ">
        <div style="
            width: 30%;
            border-radius: 20px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.3);
            padding: 30px;
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.15);
            text-align: center;
        ">
            <h3 class="mb-3 text-light">{% trans "Password Reset Successful" %}</h3>
            <p class="text-light">{% trans "Your password has been successfully reset. You can now log in with your new password." %}</p>
            <a href="{% url 'login' %}" class="th-btn btn-fw th-radius2">{% trans "Log In" %}</a>
        </div>
    </div>
</body>
