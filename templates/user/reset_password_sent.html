{% load static %}
{% load i18n %}

<head>
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
</head>
<body>
    <div style="
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: url('{% static 'assets/img/travel.jpg' %}');
        background-size: cover;
        background-position: center;
    ">
        <div style="
            width: 30%;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            padding: 30px;
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.2);
            text-align: center;
        ">
            <h3 class="mb-3">Check your email!</h3>
            <p>An email has been sent to your inbox with instructions to reset your password.</p>
            <a href="{% url 'login' %}" class="btn btn-primary mt-3">Back to Login</a>
        </div>
    </div>
</body>
