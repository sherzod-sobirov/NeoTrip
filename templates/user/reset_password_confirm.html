{% load static %}
{% load i18n %}

<head>
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <!-- Fontawesome Icon -->
    <link rel="stylesheet" href="{% static 'assets/css/fontawesome.min.css' %}">
    <!-- Magnific Popup -->
    <link rel="stylesheet" href="{% static 'assets/css/magnific-popup.min.css' %}">
    <!-- Swiper css -->
    <link rel="stylesheet" href="{% static 'assets/css/swiper-bundle.min.css' %}">
    <!-- Theme Custom CSS -->
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
</head>
<body>
    <div class="tab-content" id="pills-tabContent" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background-image: url('{% static 'assets/img/travel.jpg' %}'); background-size: cover; background-position: center center;">
        <!-- Reset Password Confirm Tab -->
        <div class="tab-pane fade active show" id="pills-reset-password-confirm" role="tabpanel" aria-labelledby="pills-reset-password-confirm-tab" style="width: 30%; border-radius: 20px; box-shadow: 0px 0px 15px 0px; padding: 20px; backdrop-filter: blur(10px); background-color: rgba(0, 0, 0, 0.1);">
              <h3 class="text-center mb-4">{% trans "Reset Your Password" %}</h3>
            <form  method="POST" class="reset-password-form">
                {% csrf_token %}
                <div class="row">
                    <div class="form-group col-12">
                        <label>{% trans 'New Password' %}*</label>
                        <input type="password" class="form-control" name="new_password1" id="new_password1" placeholder="Enter your new password" required>
                    </div>
                    <div class="form-group col-12">
                        <label>{% trans 'Confirm Password' %}*</label>
                        <input type="password" class="form-control" name="new_password2" id="new_password2" placeholder="Confirm your new password" required>
                    </div>
                    <div class="form-btn mt-20 col-12">
                        <button type="submit" class="th-btn btn-fw th-radius2">{% trans 'Reset Password' %}</button>
                    </div>
                </div>
                {% if form.errors %}
                <div class="text-danger mt-3">
                    <ul>
                        {% for field, errors in form.errors.items %}
                            {% for error in errors %}
                                <li>{{ error }}</li>
                            {% endfor %}
                        {% endfor %}
                    </ul>
                </div>
                {% endif %}
                <div class="mt-3 text-center">
                    <p><a href="{% url 'login' %}" class="forgot_pass_btn">{% trans "Back to Login" %}</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
